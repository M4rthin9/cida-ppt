name: cida-ppt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: cida
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cida -d cida]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: cida-ppt-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cida:${POSTGRES_PASSWORD:?}@db:5432/cida
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_URL: https://cidapt.dpdns.org
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: https://cidapt.dpdns.org
      MEDIA_DIR: /data/media
      LINE_OA_URL: https://line.me/ti/p/~0829414312
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${LAN_PORT:-8082}:8080"
    volumes:
      - ./deploy/Caddyfile.host:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 30s
      timeout: 5s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [internet]
    command:
      [
        tunnel,
        --no-autoupdate,
        --metrics,
        "0.0.0.0:2000",
        run,
        --token-file,
        /run/secrets/tunnel_token,
      ]
    secrets: [tunnel_token]
    depends_on:
      proxy:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      TZ: Asia/Bangkok
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/restore.sh:/usr/local/bin/restore.sh:ro
      - backups:/backups
      - media:/data/media:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 96m
    cpus: 0.25
    entrypoint: [/bin/sh, -c]
    command:
      - |
        while true; do
          if [ "$$(date +%H%M)" = "0315" ]; then
            sh /usr/local/bin/backup.sh || echo "[backup] run failed"
            sleep 3600
          fi
          sleep 30
        done

secrets:
  tunnel_token:
    file: ./.local/secrets/cloudflare-tunnel-token

volumes:
  pgdata:
  media:
  backups:
